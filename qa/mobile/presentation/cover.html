<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, initial-scale=1.0" />
  <title>Kisan Dost Agro Manager</title>
  <style>
    * { box-sizing: border-box; }
    /* Remove default body margin so the slide starts at the top (prevents the 8px overflow) */
    body { margin: 0; }
    .slide-container {
      width: 1280px;
      min-height: 720px; /* keep as required */
      background: #ffffff;
      color: #2D3732;
      display: grid;
      grid-template-columns: 170px 1fr;
      align-items: stretch;
      font-family: Arial, Helvetica, sans-serif;
    }
    .rail {
      border-right: 8px solid #4CAF50;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 58px;
    }
    .rail-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 14px;
      font-weight: 700;
      color: #4CAF50;
    }
    .content {
      padding: 112px 92px 0 88px; /* keep top padding for title consistency */
    }
    .kicker {
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
      color: #4CAF50;
      margin-bottom: 20px; /* reduced from 28 to save vertical space */
    }
    h1 {
      margin: 0;
      color: #1A3621;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 68px;
      line-height: 0.98;
      font-weight: 900;
      max-width: 860px;
      letter-spacing: -1.5px;
    }
    .subtitle {
      margin-top: 24px; /* reduced from 32 */
      max-width: 760px;
      font-size: 25px;
      line-height: 1.35;
      font-weight: 400;
    }
    .meta {
      margin-top: 46px; /* reduced from 58 */
      padding-top: 18px;
      border-top: 2px solid #1A3621;
      width: 390px;
      font-size: 15px;
      line-height: 1.5;
      color: #526057;
    }
    .square {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #4CAF50;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="rail"><div class="rail-label">Mobile systems review</div></div>
    <div class="content">
      <div class="kicker"><span class="square"></span> Kisan Dost Agro Manager</div>
      <h1>Android Mobile Navigation<br />&amp; Layout Fixes</h1>
      <p class="subtitle">A mobile-first navigation and responsive-layout improvement for the existing pesticide shop management application.</p>
      <div class="meta"><strong>Manus AI</strong><br />August 2026 · Engineering delivery summary</div>
    </div>
  </div>
</body>
</html>
